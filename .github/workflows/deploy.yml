name: Deploy to SpaceWeb

on:
  push:
    branches:
      - main # Если ваша главная ветка называется master, замените на master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy via FTP to SpaceWeb
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          
          # ВНИМАНИЕ: 
          # Если у вас Next.js (static export), замените ./dist/ на ./out/
          # Если у вас Vite/React/Vue, оставьте ./dist/
          # Если у вас просто HTML/PHP в корне, поставьте ./
          local-dir: ./
          
          server-dir: ./
          dangerous-clean-slate: false
